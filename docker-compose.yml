
services:
  db:
    image: postgres:17-alpine
    container_name: myfit-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: myfit
      POSTGRES_USER: myfit
      POSTGRES_PASSWORD: myfit_local_dev

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - myfit_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfit -d myfit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  myfit_postgres_data:
