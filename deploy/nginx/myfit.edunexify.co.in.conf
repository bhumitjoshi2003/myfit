# Include ONLY from Nginx's existing http{} context (e.g. sites-enabled).
# Confirm this exact server_name is unused and port 18080 is free BEFORE activation.
# Append after existing server files; preserve implicit default-server ordering.
# All variable/zone names are unique to MyFit. No edits to Edunexify server blocks.
map $http_cookie $myfit_cookie {
    default "";
    "~(?:^|;[ ]*)(__Host-myfit_session=[a-f0-9]{64})(?:;|$)" $1;
}
limit_req_zone $binary_remote_addr zone=myfit_auth:1m rate=10r/m;
limit_conn_zone $server_name zone=myfit_total:1m;

server {
    listen 80;
    server_name myfit.edunexify.co.in;
    access_log /var/log/nginx/myfit.access.log;
    error_log /var/log/nginx/myfit.error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/myfit/acme;
        try_files $uri =404;
    }
    location / { return 308 https://myfit.edunexify.co.in$request_uri; }
}
server {
    listen 443 ssl;
    server_name myfit.edunexify.co.in;
    # Existing wildcard paths verified by the operator; covers *.edunexify.co.in.
    # Reported expiry: 2027-01-14. Recheck validity/renewal before activation.
    # Reuse read-only: do not replace the certificate or change its renewal setup.
    ssl_certificate /etc/letsencrypt/live/edunexify-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edunexify-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:myfit_tls:1m;
    ssl_session_timeout 10m;
    server_tokens off;

    root /var/www/myfit/current;
    index index.html;
    access_log /var/log/nginx/myfit.access.log;
    error_log /var/log/nginx/myfit.error.log warn;
    include /etc/nginx/snippets/myfit-security-headers.conf;
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    limit_conn myfit_total 24;
    limit_conn_status 429;

    location = /api { return 404; }
    location ~ ^/api/(login|register)$ {
        limit_req zone=myfit_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/myfit-proxy.conf;
    }
    location /api/ {
        include /etc/nginx/snippets/myfit-proxy.conf;
    }
    location = /health {
        include /etc/nginx/snippets/myfit-proxy.conf;
    }
    location = /livez {
        include /etc/nginx/snippets/myfit-proxy.conf;
    }
    location ^~ /assets/ {
        # Filenames are content-hashed by Vite. Missing assets must never return HTML.
        try_files $uri =404;
        include /etc/nginx/snippets/myfit-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location = /index.html {
        include /etc/nginx/snippets/myfit-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location ~ /\. { deny all; }
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/myfit-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
