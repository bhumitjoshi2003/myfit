# Included only by MyFit API locations. Preserve /api paths and the browser Origin.
proxy_pass http://127.0.0.1:18080;
proxy_http_version 1.1;
proxy_set_header Host myfit.edunexify.co.in;
proxy_set_header Connection "";
proxy_set_header X-Forwarded-Proto https;
# Replace rather than append untrusted forwarding headers. API rate limiting uses
# its peer address; the MyFit-only Nginx auth zone enforces the real client limit.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
# Never forward parent-domain Edunexify cookies to the MyFit API.
proxy_set_header Cookie $myfit_cookie;
proxy_connect_timeout 3s;
proxy_send_timeout 15s;
proxy_read_timeout 20s;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_buffer_size 8k;
proxy_buffers 4 8k;
